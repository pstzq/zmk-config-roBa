# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
# NOTE: ZMK v0.4 (Zephyr 4.1 / HWMv2) でボード名が `seeeduino_xiao_ble` から
#       `xiao_ble` へ変更され、さらに ZMK 用のボードバリアント指定
#       `/nrf52840/zmk` が必須になった
#       (指定しないと CI が "Missing ZMK Compat" で失敗する)。
---
include:
  - board: xiao_ble/nrf52840/zmk
    shield: roBa_R
    snippet: studio-rpc-usb-uart
    artifact-name: roBa_R
  - board: xiao_ble/nrf52840/zmk
    shield: roBa_L
    artifact-name: roBa_L
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset

  # 診断用。roBa_R と中身は同じだが、ログ用の CDC ACM をもう1本生やして
  # Studio サブシステムのログを DEBUG で出す。Studio の接続失敗のように
  # 「何が起きているか分からない」ときだけ焼くこと (常用しない)。
  #
  # 焼くと OS にシリアルポートが2本見える:
  #   1本目 = Studio RPC (Web アプリから選ぶ方)
  #   2本目 = ログ (screen/teraterm 等で開く方。ボーレートは何でもよい)
  # どちらがどちらかは、ログ側を開いて起動メッセージが流れる方で判別する。
  #
  # snippet: は再利用ワークフローが -S "..." と1個しか渡せないため、
  # 2つ使うときは cmake の SNIPPET 変数へ直接渡す。
  - board: xiao_ble/nrf52840/zmk
    shield: roBa_R
    cmake-args: '-DSNIPPET="studio-rpc-usb-uart;zmk-usb-logging" -DCONFIG_ZMK_STUDIO_LOG_LEVEL_DBG=y'
    artifact-name: roBa_R_logging
