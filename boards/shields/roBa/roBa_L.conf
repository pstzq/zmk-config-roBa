CONFIG_NFCT_PINS_AS_GPIOS=y

#Encoder config -------------------
# 左手サムの CKW12 (クリック付き水平ロータリーエンコーダ) の「回転」側。
# 「押下」側はキーマトリクスの通常キーなので、ここでは扱わない。
CONFIG_EC11=y

# 既知の制約: 回し始めの1ノッチだけ反応しないことがある。
#
# ec11_trigger.c は割り込みコールバックの冒頭で setup_int(dev, false) と
# A/B 両方の割り込みを止め、実処理が終わってから戻す。この目隠し区間に
# 2遷移入ると ec11_sample_fetch のデコード表が default: delta = 0 で黙って
# 捨てるため、2パルス (15度 = 半ノッチ) が消える。15度ずれると累積が
# 15 -> 45 -> 45 ... と推移し、1ノッチ目だけトリガが出ず以降は安定する。
#
# 「目隠し区間がシステムワークキューの待ちで伸びている」と読んで
# CONFIG_EC11_TRIGGER_OWN_THREAD=y (専用スレッド、協調優先度 -6 相当) を
# 実機で試したが、症状は変わらなかった。よってこの読みは外れており、
# 待ち時間以外の要因 (動き出しの接点チャタリング等) と思われる。
# 同じ手を再試行しないよう記録しておく。直すならドライバをフォークして
# デコード表を2ステップ遷移対応にする必要がある。
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 左手にも &mkp / &msc を割り当てられるようにする (本家 PR #35 由来)
CONFIG_ZMK_POINTING=y

# zmk-feature-custom-settings -------------------
# 周辺側は Studio RPC 自体は不要。中継ハンドラをビルドするために relay だけ
# 有効化する。これが無いと Studio で変えた設定が左手に伝わらない。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# zmk-module-settings-rpc -------------------
CONFIG_ZMK_SETTINGS_RPC=y

# 診断 (中央側経由で DYA Studio に返す) -------------------
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_WATCHDOG=y

# Split relay and settings persistence -------------------
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は右手と同じ値にすること (不一致だと中継が壊れる)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
