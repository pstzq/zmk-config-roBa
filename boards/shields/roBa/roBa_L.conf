CONFIG_NFCT_PINS_AS_GPIOS=y

#Encoder config -------------------
# 左手サムの CKW12 (クリック付き水平ロータリーエンコーダ) の「回転」側。
# 「押下」側はキーマトリクスの通常キーなので、ここでは扱わない。
CONFIG_EC11=y

# GLOBAL_THREAD ではなく専用スレッドで処理する。
#
# 理由: ec11_trigger.c は割り込みコールバックの冒頭で setup_int(dev, false) と
# して A/B 両方の割り込みを止め、実処理 (センサー読み取り〜ZMKイベント発行〜
# split 中継) が終わってから setup_int(dev, true) で戻す。この「目隠し区間」に
# 入った遷移は割り込みが上がらず、復帰時の AB 状態比較で拾うことになるが、
# ec11_sample_fetch のデコード表は1ステップ分の遷移しか解釈できず、2ステップ
# 飛んでいると default: delta = 0 で黙って捨てる。
# = 2パルス(15度 = 半ノッチ)が消える。
#
# GLOBAL_THREAD だと実処理が BLE や kscan デバウンスと共用のシステム
# ワークキューに積まれるため、操作開始時はそこで待たされて目隠し区間が伸び、
# 「回し始めの1ノッチだけ反応しない」が起きる (実機で確認)。回し続けている
# 間はキューが温まっていて遅延が小さいので出ない。
#
# 専用スレッドにすると、システムワークキューの行列に並ばず自分のセマフォで
# 起きるので、割り込みから読み取りまでの遅延が詰まる。
#
# CONFIG_EC11_THREAD_PRIORITY は既定の 10 のまま触らないこと。この値は生の
# 優先度ではなく、ドライバが k_thread_create(..., K_PRIO_COOP(値), ...) と
# 渡すオフセットで、K_PRIO_COOP(x) = -CONFIG_NUM_COOP_PRIORITIES + x。
# 既定の 10 は -6 相当で、システムワークキュー (-1) より既に高優先度。
# 「もっと速く」と負の値を入れると範囲外 (-16〜-1) になって壊れる。
#
# 効果が無い/副作用が出る場合は下2行を消して
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y に戻せばよい。
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_STACK_SIZE=1024

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 左手にも &mkp / &msc を割り当てられるようにする (本家 PR #35 由来)
CONFIG_ZMK_POINTING=y

# zmk-feature-custom-settings -------------------
# 周辺側は Studio RPC 自体は不要。中継ハンドラをビルドするために relay だけ
# 有効化する。これが無いと Studio で変えた設定が左手に伝わらない。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# zmk-module-settings-rpc -------------------
CONFIG_ZMK_SETTINGS_RPC=y

# 診断 (中央側経由で DYA Studio に返す) -------------------
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_WATCHDOG=y

# Split relay and settings persistence -------------------
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は右手と同じ値にすること (不一致だと中継が壊れる)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
